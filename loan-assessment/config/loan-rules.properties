# Business-rule thresholds. Edit and re-run; no recompilation needed.

# Income-to-expense: monthly income must be at least this many times monthly expenses.
rule.incomeToExpense.minRatio=1.5

# Employment: comma-separated statuses that may borrow, and minimum months in the current job/business.
rule.employment.allowedStatuses=EMPLOYED,SELF_EMPLOYED
rule.employment.minMonths=6

# Debt: (existing monthly debt + new installment) divided by monthly income must not exceed this.
rule.debt.maxDebtToIncomeRatio=0.40

# Loan cap: requested amount must not exceed this many months of income.
rule.loanCap.maxMonthsOfIncome=6
